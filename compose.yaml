services:
  postgres:
    image: postgres:16-alpine
    container_name: covoiturage-postgres
    environment:
      POSTGRES_DB: covoiturage_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  adminer:
    image: adminer:4-standalone
    container_name: covoiturage-adminer
    ports:
      - "8081:8080"
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  postgres_data: